<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <title>Product preview card component</title>
<link rel="stylesheet" href="css/style.css">

</head>
<body>

    <div class="main-component">
        <div class="image"><img src="images/image-product-desktop.jpg" alt=""></div>
        <div class="content">
        <p>Perfume</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <div class="description"> A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</div>
        <div class="price">
            <span class="new-price">$149.99</span>
            <span class="old-price">$169.99</span>
        </div>
        <button><img src="images/icon-cart.svg" alt="">Add to Cart</button>
        </div>
    </div>
  
</body>
</html>
